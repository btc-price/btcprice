<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>داشبورد قیمت نوبیتکس</title>
  <link rel="icon" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<text x='50%' y='55%' font-size='100' text-anchor='middle' dominant-baseline='middle'>₿</text>
</svg>">

  <style>
    :root {
      --bg: #f4f6f8;
      --card-bg: #fff;
      --text: #222;
      --text-muted: #777;
      --border: #eee;
      --green: #1b5e20;
      --green-bg: #e8f5e9;
      --red: #b71c1c;
      --red-bg: #ffebee;
      --accent: #2962ff;
    }
    * { box-sizing: border-box; }
    body{
      margin:0;
      font-family:Tahoma,sans-serif;
      direction:rtl;
      background:var(--bg);
      color:var(--text);
      padding:24px;
      transition: background .3s, color .3s;
    }
    body.dark {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #eee;
      --text-muted: #aaa;
      --border: #333;
      --green-bg: #1b3a1e;
      --red-bg: #3a1b1b;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 24px; }
    .controls { display: flex; gap: 8px; }
    .controls button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      transition: all .2s;
    }
    .controls button:hover { border-color: var(--accent); color: var(--accent); }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:16px;
    }
    .card{
      background:var(--card-bg);
      border-radius:14px;
      padding:18px;
      box-shadow:0 4px 18px rgba(0,0,0,.08);
      transition: background .3s;
    }
    .card h2{
      margin-top:0;
      font-size:18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card h2 a {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
    }
    .row{
      display:flex;
      justify-content:space-between;
      align-items: center;
      padding:12px 0;
      border-bottom:1px solid var(--border);
    }
    .row:last-child{ border-bottom:none; }
    .label{ font-weight:bold; font-size: 14px; }
    .value-wrap { display: flex; align-items: center; gap: 8px; }
    .value{
      font-weight:bold;
      direction:ltr;
      font-size: 18px;
    }
    .change {
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      direction: ltr;
    }
    .change.up { color: var(--green); background: var(--green-bg); }
    .change.down { color: var(--red); background: var(--red-bg); }
    .change.same { color: var(--text-muted); }
    .big{ font-size:20px; }
    .small{
      margin-top:10px;
      color:var(--text-muted);
      font-size:11px;
      line-height:1.8;
    }
    .error, .ok, .warn {
      padding:10px 14px;
      border-radius:10px;
      margin-top:16px;
      font-size: 13px;
      white-space:pre-line;
    }
    .error{ background:var(--red-bg); color:var(--red); }
    .ok{ background:var(--green-bg); color:var(--green); }
    .warn{ background: #fff8e1; color: #e65100; }
    body.dark .warn { background: #3a2e1b; color: #ffb74d; }
    .last-update {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: center;
    }
    .loading {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 2px solid var(--text-muted);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      margin-left: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <h1>داشبورد قیمت رمزارزها</h1>
    <div class="controls">
      <button id="refreshBtn">به‌روزرسانی</button>
      <button id="themeBtn">🌙 حالت شب</button>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <h2>
        <span>نوبیتکس</span>
        <a href="https://nobitex.ir/panel/exchange/usdt-irt/" target="_blank">مشاهده ↗</a>
      </h2>
      <div class="row">
        <div class="label">تتر به تومان</div>
        <div class="value-wrap">
          <div class="value big" id="usdtirt1-last">...</div>
          <span class="change" id="usdtirt1-change"></span>
        </div>
      </div>
      <div class="row">
        <div class="label">بیت‌کوین به تتر</div>
        <div class="value-wrap">
          <div class="value big" id="btcusdt1-last">...</div>
          <span class="change" id="btcusdt1-change"></span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>
        <span>بیت‌پین</span>
        <a href="https://bitpin.ir/trade/USDT_IRT/?side=buy&tab=spot" target="_blank">مشاهده ↗</a>
      </h2>
      <div class="row">
        <div class="label">تتر به تومان</div>
        <div class="value-wrap">
          <div class="value big" id="usdtirt2-last">...</div>
          <span class="change" id="usdtirt2-change"></span>
        </div>
      </div>
      <div class="row">
        <div class="label">بیت‌کوین به تتر</div>
        <div class="value-wrap">
          <div class="value big" id="btcusdt2-last">...</div>
          <span class="change" id="btcusdt2-change"></span>
        </div>
      </div>
    </div>
  </div>

  <div id="status" class="ok">در حال دریافت داده...</div>
  <div class="last-update" id="lastUpdate"></div>

  <script>
    const REFRESH_INTERVAL = 8000;
    const prevValues = {};

    function num(x){
      return Number(String(x).replace(/,/g,''));
    }

    function fmt(x, digits=0){
      if (x === null || x === undefined || Number.isNaN(x)) return '---';
      return Number(x).toLocaleString('en-US', {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      });
    }

    async function fetchWithTimeout(url, ms=8000) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), ms);
      try {
        const res = await fetch(url, {
          headers: { 'Accept': 'application/json' },
          signal: controller.signal
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } finally {
        clearTimeout(timeout);
      }
    }

    async function getOrderbook(symbol){
      const url = `https://apiv2.nobitex.ir/v3/orderbook/${symbol}`;
      const data = await fetchWithTimeout(url);
      const last = num(data.lastTradePrice);
      if (Number.isNaN(last)) throw new Error('Invalid price');
      return { symbol, last };
    }

    async function getBitpinPrice(symbol){
      const url = `https://api.bitpin.ir/api/v1/mkt/tickers/`;
      const data = await fetchWithTimeout(url);
      const market = data.find(m => m.symbol === symbol);
      if (!market) throw new Error(`Market not found: ${symbol}`);
      return num(market.price);
    }

    function setText(id, value){
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function setChange(id, current, prev){
      const el = document.getElementById(id);
      if (!el) return;
      el.className = 'change';
      el.textContent = '';
      if (prev === undefined || prev === null || Number.isNaN(prev)) return;
      const diff = current - prev;
      if (Math.abs(diff) < 0.0001) {
        el.classList.add('same');
        el.textContent = '—';
      } else if (diff > 0) {
        el.classList.add('up');
        el.textContent = '▲ ' + fmt(diff, 0);
      } else {
        el.classList.add('down');
        el.textContent = '▼ ' + fmt(Math.abs(diff), 0);
      }
    }

    async function refresh(){
      const status = document.getElementById('status');
      status.className = 'ok';
      status.innerHTML = 'در حال دریافت داده... <span class="loading"></span>';

      const results = await Promise.allSettled([
        getOrderbook('USDTIRT'),
        getOrderbook('BTCUSDT'),
        getBitpinPrice('USDT_IRT'),
        getBitpinPrice('BTC_USDT')
      ]);

      const [usdtirt1, btcusdt1, usdtirt2, btcusdt2] = results;

      // نوبیتکس
      if (usdtirt1.status === 'fulfilled') {
        const val = usdtirt1.value.last / 10; // ریال به تومان
        setText('usdtirt1-last', fmt(val));
        setChange('usdtirt1-change', val, prevValues.usdtirt1);
        prevValues.usdtirt1 = val;
      } else {
        setText('usdtirt1-last', '---');
      }

      if (btcusdt1.status === 'fulfilled') {
        const val = btcusdt1.value.last;
        setText('btcusdt1-last', fmt(val));
        setChange('btcusdt1-change', val, prevValues.btcusdt1);
        prevValues.btcusdt1 = val;
      } else {
        setText('btcusdt1-last', '---');
      }

      // بیت‌پین
      if (usdtirt2.status === 'fulfilled') {
        const val = usdtirt2.value;
        setText('usdtirt2-last', fmt(val));
        setChange('usdtirt2-change', val, prevValues.usdtirt2);
        prevValues.usdtirt2 = val;
      } else {
        setText('usdtirt2-last', '---');
      }

      if (btcusdt2.status === 'fulfilled') {
        const val = btcusdt2.value;
        setText('btcusdt2-last', fmt(val));
        setChange('btcusdt2-change', val, prevValues.btcusdt2);
        prevValues.btcusdt2 = val;
      } else {
        setText('btcusdt2-last', '---');
      }

      // وضعیت
      const failedCount = results.filter(r => r.status === 'rejected').length;

      if (failedCount === 0) {
        status.className = 'ok';
        status.textContent = 'داده‌ها با موفقیت دریافت شدند.';
      } else if (failedCount < results.length) {
        status.className = 'warn';
        status.textContent = `${failedCount} مورد از ${results.length} دریافت نشد. بقیه نمایش داده شده‌اند.`;
      } else {
        status.className = 'error';
        status.textContent = 'هیچ‌کدام از داده‌ها دریافت نشدند. اتصال اینترنت یا دسترسی به APIها را بررسی کنید.';
      }

      // زمان آخرین به‌روزرسانی
      const now = new Date();
      const timeStr = now.toLocaleTimeString('fa-IR');
      document.getElementById('lastUpdate').textContent = `آخرین به‌روزرسانی: ${timeStr}`;
    }

    // دکمه به‌روزرسانی دستی
    document.getElementById('refreshBtn').addEventListener('click', refresh);

    // دکمه حالت شب
    document.getElementById('themeBtn').addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      document.getElementById('themeBtn').textContent = isDark ? '☀️ حالت روز' : '🌙 حالت شب';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // بازیابی تنظیمات حالت شب
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      document.getElementById('themeBtn').textContent = '☀️ حالت روز';
    }

    // شروع
    refresh();
    setInterval(refresh, REFRESH_INTERVAL);
  </script>
</body>
</html>
